<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `--base-href` at build time. -->
  <base href="/yai-calendar-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lightweight offline-first calendar.">
  <meta name="theme-color" content="#000000">

  <!-- iOS: installed-to-home-screen behaviour -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yai Calendar">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Yai Calendar</title>

  <style>
    /* Paint the app background before Flutter boots: no white flash. */
    html, body { margin: 0; height: 100%; background: #000000; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #000000;
      color: #FF453A; font: 600 15px/1 -apple-system, system-ui, sans-serif; letter-spacing: .04em;
      transition: opacity .3s ease;
    }
  </style>
</head>
<body>
  <div id="boot">Yai Calendar</div>
  <script>
    // Fade the splash out once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 350);
    });
  </script>
  <script>
    // Offline app shell. `sw.js` lives at the app root so its scope covers it.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
